<main>
<section class="contact">
  <p class="label purple">004 / CONTACT</p>
  <p class="sub">Freelance / collaboration / opportunities</p>
  <h1>HAVE AN IDEA?<br><span>LET'S TALK.</span></h1>

  <div class="contact-layout">
    <form class="contact-form" action="https://formspree.io/f/xkjggajb" method="POST">
      <div class="form-row">
        <div class="field">
          <label for="name">NAME</label>
          <input id="name" name="name" type="text" placeholder="Your name" required>
        </div>
        <div class="field">
          <label for="email">EMAIL</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
        </div>
      </div>

      <div class="field">
        <label for="subject">SUBJECT</label>
        <input id="subject" name="subject" type="text" placeholder="What are you reaching out about?" required>
      </div>

      <div class="field">
        <label for="message">MESSAGE</label>
        <textarea id="message" name="message" rows="7" placeholder="Tell me about your idea or project." required></textarea>
      </div>

      <button class="send-button" type="submit">SEND MESSAGE</button>
    </form>

    <aside class="contact-social">
      <small>PROFESSIONAL</small>
      <h2>LINKEDIN</h2>
      <p>Connect with me!&nbsp;</p>
      <a class="linkedin-link" href="https://www.linkedin.com/in/offaxiscreative" target="_blank" rel="noopener noreferrer">LINKEDIN PROFILE</a>
    </aside>
  </div>
</section>
</main>
